; Catppuccin Mocha, colors from https://github.com/catppuccin/polybar
[colors]
base = #1e1e2e
crust = #11111b
surface1 = #45475a
overlay0 = #6c7086
text = #cdd6f4
subtext0 = #a6adc8
mauve = #cba6f7
lavender = #b4befe
blue = #89b4fa
green = #a6e3a1
peach = #fab387
red = #f38ba8
teal = #94e2d5

[bar/main]
; one bar per monitor; launch.sh sets MONITOR for each
monitor = ${env:MONITOR:}
width = 100%:-16
offset-x = 8
offset-y = 6
height = 30
radius = 8
background = ${colors.base}
foreground = ${colors.text}
padding-right = 2
module-margin = 1
font-0 = Hack Nerd Font:size=10;3
modules-left = i3 xwindow
modules-right = gpu cpu memory pulseaudio date lock
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
label-focused = %name%
label-focused-background = ${colors.mauve}
label-focused-foreground = ${colors.crust}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext0}
label-unfocused-padding = 2
label-visible = %name%
label-visible-background = ${colors.surface1}
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.crust}
label-urgent-padding = 2
label-mode = %mode%
label-mode-background = ${colors.peach}
label-mode-foreground = ${colors.crust}
label-mode-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-foreground = ${colors.subtext0}

[module/gpu]
type = custom/script
exec = ~/.config/polybar/gpu.sh
interval = 3
format-prefix = "󰢮 "
format-prefix-foreground = ${colors.peach}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.green}
label = %used%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.mauve}
label-volume = %percentage%%
label-muted =  muted
label-muted-foreground = ${colors.overlay0}

; not in modules-right; add "eth" back to show it again
[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.teal}
label-connected = %local_ip%
label-disconnected = offline
label-disconnected-foreground = ${colors.overlay0}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
format-prefix = " "
format-prefix-foreground = ${colors.lavender}
; left click toggles a floating 3-month calendar (action tag: the generic
; click-left setting is ignored for internal/date in polybar 3.7)
label = %{A1:$HOME/.config/polybar/calendar.sh:}%date%  %time%%{A}

; click to lock the screen (same script as $mod+Shift+x and xss-lock)
[module/lock]
type = custom/text
format = %{A1:$HOME/bin/lock-screen:}%{A}
format-foreground = ${colors.red}
format-padding = 1

[settings]
screenchange-reload = true
