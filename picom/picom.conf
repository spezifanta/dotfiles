# Compositor: rounded corners, shadows, fades, blur behind translucent terminals

backend = "glx";
vsync = true;

# Stop compositing fullscreen windows (games) so they get full performance
unredir-if-possible = true;

corner-radius = 8;

# Focus is shown by the i3 border colour only -- no dimming, no opacity change.

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'firefox' && argb"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [ "class_g != 'Alacritty'" ];
